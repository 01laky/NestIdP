# Development stack: encrypted libSQL file + hot reload (Nest watch + Vite HMR).
# Usage: pnpm dev:docker
# Production (unchanged): docker compose up --build
#
# Open http://localhost:5173 for the admin SPA (proxies /api and /saml to the API).
# API alone: http://localhost:3000
#
# localhost inside nestidp-dev resolves to the host (see extra_hosts) so a mock API on
# the host at http://localhost:4010 is reachable with that same URL from sync/tests.

services:
  # Disable production image when using --profile dev (see pnpm dev:docker).
  nestidp:
    profiles:
      - production

  nestidp-dev:
    profiles:
      - dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
      - '5173:5173'
    env_file:
      - .env.docker
    environment:
      DATABASE_URL: file:/app/apps/api/data/nestidp.db
      NODE_ENV: development
      PORT: '3000'
      IDP_BASE_URL: http://localhost:5173
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      FORCE_TSC_POLLING: 'true'
      VITE_API_PROXY_TARGET: http://127.0.0.1:3000
    volumes:
      - ./:/app
      - dev_root_node_modules:/app/node_modules
      - dev_api_node_modules:/app/apps/api/node_modules
      - dev_web_node_modules:/app/apps/web/node_modules
      - dev_shared_node_modules:/app/packages/shared/node_modules
    extra_hosts:
      - localhost:host-gateway

volumes:
  dev_root_node_modules:
  dev_api_node_modules:
  dev_web_node_modules:
  dev_shared_node_modules:

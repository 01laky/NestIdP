name: CI

on:
	push:
		branches: [main]
	pull_request:
		branches: [main]

jobs:
	verify:
		runs-on: ubuntu-latest
		services:
			postgres:
				image: postgres:16-alpine
				env:
					POSTGRES_USER: nestidp
					POSTGRES_PASSWORD: nestidp
					POSTGRES_DB: nestidp_test
				ports:
					- 5432:5432
				options: >-
					--health-cmd pg_isready
					--health-interval 10s
					--health-timeout 5s
					--health-retries 5

		steps:
			- uses: actions/checkout@v4

			- uses: pnpm/action-setup@v4
				with:
					version: 9

			- uses: actions/setup-node@v4
				with:
					node-version: 20
					cache: pnpm

			- run: cp .env.example .env

			- run: mkdir -p apps/api/data

			- run: pnpm install

			- run: pnpm lint

			- run: pnpm test
				env:
					POSTGRES_TEST_URL: postgresql://nestidp:nestidp@localhost:5432/nestidp_test

			- run: pnpm build

			- run: pnpm diagrams:check

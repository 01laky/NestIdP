name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: cp .env.example .env

      - run: mkdir -p apps/api/data

      - run: pnpm install

      - run: pnpm lint

      - run: pnpm test
        env:
          CI: true

      - run: pnpm build

      - run: node scripts/check-web-bundle-size.mjs

      - run: pnpm diagrams:build

      - run: pnpm diagrams:check

      - run: pnpm --filter @nestidp/web exec playwright install chromium --with-deps

      - run: pnpm --filter @nestidp/web test:e2e:ci
        env:
          CI: true

  docker-smoke:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: cp .env.docker.example .env.docker

      - run: pnpm install

      - run: pnpm build

      - name: Docker compose up
        run: |
          docker compose up -d --build --wait
          sleep 5

      - name: CI docker smoke
        env:
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: change-me-strong-password-min-12-chars
        run: |
          chmod +x scripts/ci-docker-smoke.sh
          ./scripts/ci-docker-smoke.sh http://localhost:3000

      - name: Container logs + health on failure
        if: failure()
        run: |
          echo "::group::compose ps"; docker compose ps; echo "::endgroup::"
          echo "::group::container health"; docker inspect --format '{{json .State.Health}}' nestidp-nestidp-1 || true; echo "::endgroup::"
          echo "::group::container logs"; docker compose logs --no-color nestidp || true; echo "::endgroup::"

      - name: Tear down
        if: always()
        run: docker compose down -v

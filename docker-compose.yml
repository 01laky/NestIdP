services:
  nestidp:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env.docker
    environment:
      # Encrypted libSQL file lives on the mounted data volume.
      DATABASE_URL: file:/app/apps/api/data/nestidp.db
      # Provide the at-rest key via .env.docker (DATABASE_ENCRYPTION_KEY) or a
      # mounted secret referenced by DATABASE_ENCRYPTION_KEY_FILE. Required in production.
      NODE_ENV: production
      PORT: '3000'
      IDP_BASE_URL: http://localhost:3000
    volumes:
      - nestidp_data:/app/apps/api/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  nestidp_data:
